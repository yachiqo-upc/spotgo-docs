<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1450" viewBox="0 0 1600 1450">
  <rect width="100%" height="100%" fill="#f5f7fb" />
  <rect x="12" y="12" width="1576" height="1426" rx="20" fill="#fbfdff" stroke="#dbe4f0" stroke-width="2" />
  <rect x="12" y="12" width="1576" height="68" rx="20" fill="#2E8B57" opacity="0.16" />
  <circle cx="44" cy="46" r="10" fill="#2E8B57" opacity="0.9" />
  <text x="68" y="55" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#0f172a" font-weight="bold"><tspan x="68" dy="0">Bounded Context Canvas — Profiles &amp; Vehicles Management</tspan></text>
  
    <g>
      <rect x="28" y="122" width="760" height="76" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6" />
      <rect x="28" y="122" width="760" height="34" rx="12" fill="#2E8B57" opacity="0.12" />
      <line x1="28" y1="156" x2="788" y2="156" stroke="#d1d5db" stroke-width="1.2" />
      <text x="44" y="146" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2E8B57" font-weight="bold"><tspan x="44" dy="0">Name</tspan></text>
      <text x="44" y="182" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#111827" font-weight="normal"><tspan x="44" dy="0">Profiles &amp; Vehicles Management</tspan></text>
    </g>
    <g>
      <rect x="28" y="212" width="760" height="190" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6" />
      <rect x="28" y="212" width="760" height="34" rx="12" fill="#2E8B57" opacity="0.12" />
      <line x1="28" y1="246" x2="788" y2="246" stroke="#d1d5db" stroke-width="1.2" />
      <text x="44" y="236" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2E8B57" font-weight="bold"><tspan x="44" dy="0">Purpose</tspan></text>
      <text x="44" y="272" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111827" font-weight="normal"><tspan x="44" dy="0">Gestionar la identidad de negocio del conductor, sus datos,</tspan><tspan x="44" dy="27.0">sus vehículos y los perfiles asociados, y exponer la</tspan><tspan x="44" dy="27.0">información necesaria para validar elegibilidad antes de</tspan><tspan x="44" dy="27.0">reservar o ejecutar operaciones dentro de SpotGo.</tspan></text>
    </g>
    <g>
      <rect x="28" y="416" width="760" height="165" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6" />
      <rect x="28" y="416" width="760" height="34" rx="12" fill="#2E8B57" opacity="0.12" />
      <line x1="28" y1="450" x2="788" y2="450" stroke="#d1d5db" stroke-width="1.2" />
      <text x="44" y="440" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2E8B57" font-weight="bold"><tspan x="44" dy="0">Strategic Classification</tspan></text>
      <rect x="44.0" y="474" width="237.33333333333334" height="91" rx="10" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/><text x="54.0" y="496" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569" font-weight="bold"><tspan x="54.0" dy="0">Domain</tspan></text><text x="54.0" y="528" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0f172a" font-weight="bold"><tspan x="54.0" dy="0">Supporting Domain</tspan></text><rect x="289.33333333333337" y="474" width="237.33333333333334" height="91" rx="10" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/><text x="299.33333333333337" y="496" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569" font-weight="bold"><tspan x="299.33333333333337" dy="0">Business Model</tspan></text><text x="299.33333333333337" y="528" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0f172a" font-weight="bold"><tspan x="299.33333333333337" dy="0">Engagement</tspan></text><rect x="534.6666666666667" y="474" width="237.33333333333334" height="91" rx="10" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/><text x="544.6666666666667" y="496" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569" font-weight="bold"><tspan x="544.6666666666667" dy="0">Evolution</tspan></text><text x="544.6666666666667" y="528" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0f172a" font-weight="bold"><tspan x="544.6666666666667" dy="0">Custom-built</tspan></text>
    </g>
    <g>
      <rect x="28" y="595" width="760" height="120" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6" />
      <rect x="28" y="595" width="760" height="34" rx="12" fill="#2E8B57" opacity="0.12" />
      <line x1="28" y1="629" x2="788" y2="629" stroke="#d1d5db" stroke-width="1.2" />
      <text x="44" y="619" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2E8B57" font-weight="bold"><tspan x="44" dy="0">Domain Roles</tspan></text>
      <text x="44" y="655" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111827" font-weight="normal"><tspan x="44" dy="0">Conductor, Vehículo, Perfil de usuario, Visitante, Staff,</tspan><tspan x="44" dy="27.0">Administrador de estacionamiento.</tspan></text>
    </g>
    <g>
      <rect x="28" y="729" width="760" height="140" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6" />
      <rect x="28" y="729" width="760" height="34" rx="12" fill="#2E8B57" opacity="0.12" />
      <line x1="28" y1="763" x2="788" y2="763" stroke="#d1d5db" stroke-width="1.2" />
      <text x="44" y="753" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2E8B57" font-weight="bold"><tspan x="44" dy="0">Ubiquitous Language</tspan></text>
      <text x="44" y="789" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111827" font-weight="normal"><tspan x="44" dy="0">Driver, Vehicle, User Profile, Visitor, Staff, Profile</tspan><tspan x="44" dy="27.0">Assignment, Vehicle Association, Driver Data.</tspan></text>
    </g>
    <g>
      <rect x="28" y="883" width="760" height="300" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6" />
      <rect x="28" y="883" width="760" height="34" rx="12" fill="#2E8B57" opacity="0.12" />
      <line x1="28" y1="917" x2="788" y2="917" stroke="#d1d5db" stroke-width="1.2" />
      <text x="44" y="907" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2E8B57" font-weight="bold"><tspan x="44" dy="0">Business Decisions</tspan></text>
      <text x="44" y="943" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#111827" font-weight="normal"><tspan x="44" dy="0">• Un conductor debe tener un vehículo asociado antes de crear</tspan><tspan x="44" dy="25.650000000000002">  una reserva</tspan><tspan x="44" dy="25.650000000000002">• El perfil pertenece al conductor y determina restricciones</tspan><tspan x="44" dy="25.650000000000002">  operativas</tspan><tspan x="44" dy="25.650000000000002">• La asignación o revocación de Staff solo puede realizarla un</tspan><tspan x="44" dy="25.650000000000002">  actor autorizado</tspan><tspan x="44" dy="25.650000000000002">• Los vehículos externos no crean registros persistentes de</tspan><tspan x="44" dy="25.650000000000002">  conductor/vehículo</tspan></text>
    </g>
  
    <g>
      <rect x="806" y="122" width="766" height="240" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6" />
      <rect x="806" y="122" width="766" height="34" rx="12" fill="#2E8B57" opacity="0.12" />
      <line x1="806" y1="156" x2="1572" y2="156" stroke="#d1d5db" stroke-width="1.2" />
      <text x="822" y="146" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2E8B57" font-weight="bold"><tspan x="822" dy="0">Inbound Communication</tspan></text>
      <text x="822" y="182" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111827" font-weight="normal"><tspan x="822" dy="0">• Registrar conductor</tspan><tspan x="822" dy="27.0">• Registrar y asociar vehículo</tspan><tspan x="822" dy="27.0">• Asignar perfil de usuario</tspan><tspan x="822" dy="27.0">• Revocar perfil Staff</tspan><tspan x="822" dy="27.0">• Consultar conductor, vehículo y perfil desde</tspan><tspan x="822" dy="27.0">  Parking Infrastructure</tspan></text>
    </g>
    <g>
      <rect x="806" y="376" width="766" height="230" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6" />
      <rect x="806" y="376" width="766" height="34" rx="12" fill="#2E8B57" opacity="0.12" />
      <line x1="806" y1="410" x2="1572" y2="410" stroke="#d1d5db" stroke-width="1.2" />
      <text x="822" y="400" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2E8B57" font-weight="bold"><tspan x="822" dy="0">Outbound Communication</tspan></text>
      <text x="822" y="436" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111827" font-weight="normal"><tspan x="822" dy="0">• DriverRegistered</tspan><tspan x="822" dy="27.0">• VehicleAssociated</tspan><tspan x="822" dy="27.0">• ProfileAssigned / ProfileRevoked</tspan><tspan x="822" dy="27.0">• DriverProfileValidated hacia Parking</tspan><tspan x="822" dy="27.0">  Infrastructure</tspan><tspan x="822" dy="27.0">• Datos de elegibilidad hacia Identity &amp; Access Management</tspan></text>
    </g>
    <g>
      <rect x="806" y="620" width="766" height="150" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6" />
      <rect x="806" y="620" width="766" height="34" rx="12" fill="#2E8B57" opacity="0.12" />
      <line x1="806" y1="654" x2="1572" y2="654" stroke="#d1d5db" stroke-width="1.2" />
      <text x="822" y="644" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2E8B57" font-weight="bold"><tspan x="822" dy="0">Assumptions</tspan></text>
      <text x="822" y="680" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111827" font-weight="normal"><tspan x="822" dy="0">Este contexto es la fuente autorizada de datos del conductor</tspan><tspan x="822" dy="27.0">y del vehículo. Los perfiles pueden variar según la operación</tspan><tspan x="822" dy="27.0">del tenant, pero la asociación conductor–vehículo debe</tspan><tspan x="822" dy="27.0">mantenerse consistente.</tspan></text>
    </g>
    <g>
      <rect x="806" y="784" width="766" height="180" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6" />
      <rect x="806" y="784" width="766" height="34" rx="12" fill="#2E8B57" opacity="0.12" />
      <line x1="806" y1="818" x2="1572" y2="818" stroke="#d1d5db" stroke-width="1.2" />
      <text x="822" y="808" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2E8B57" font-weight="bold"><tspan x="822" dy="0">Verification Metrics</tspan></text>
      <text x="822" y="844" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111827" font-weight="normal"><tspan x="822" dy="0">• % de vehículos correctamente asociados</tspan><tspan x="822" dy="27.0">• Tiempo medio de consulta de elegibilidad</tspan><tspan x="822" dy="27.0">• N.º de inconsistencias conductor–perfil</tspan><tspan x="822" dy="27.0">• N.º de asignaciones o revocaciones inválidas</tspan></text>
    </g>
    <g>
      <rect x="806" y="978" width="766" height="130" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6" />
      <rect x="806" y="978" width="766" height="34" rx="12" fill="#2E8B57" opacity="0.12" />
      <line x1="806" y1="1012" x2="1572" y2="1012" stroke="#d1d5db" stroke-width="1.2" />
      <text x="822" y="1002" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2E8B57" font-weight="bold"><tspan x="822" dy="0">Open Questions</tspan></text>
      <text x="822" y="1038" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111827" font-weight="normal"><tspan x="822" dy="0">• ¿El perfil Staff es global o específico por tenant?</tspan><tspan x="822" dy="27.0">• ¿Qué ocurre con una reserva confirmada si cambia el perfil</tspan><tspan x="822" dy="27.0">  del conductor?</tspan></text>
    </g>
</svg>
