<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Impact Map de SpotGo - alcance mobile-first</title>
  <desc id="desc">Mapa de impacto que relaciona tres objetivos de negocio SMART con los actores Carlos Ramirez y Andres Salazar, sus impactos, entregables y las principales user stories del alcance mobile-first, incluyendo reservas, pagos, monitoreo y navegación.</desc>
  <style>
    .bg { fill: #343840; }
    .top { fill: #292d34; }
    .column { fill: #3d424b; stroke: #555b65; stroke-width: 1; }
    .goal { fill: #f5f6f8; stroke: #ffb52e; stroke-width: 3; }
    .actor { fill: #e5f4f5; stroke: #35c0cf; stroke-width: 3; }
    .impact { fill: #fff0d5; stroke: #ffb52e; stroke-width: 3; }
    .deliverable { fill: #efe5ff; stroke: #a56cff; stroke-width: 3; }
    .story { fill: #ffffff; stroke: #ff3d9a; stroke-width: 3; }
    .title { fill: #ffffff; font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 1px; }
    .header { fill: #d9dde4; font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 1px; }
    .label { fill: #31343a; font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; }
    .text { fill: #3b3e45; font-family: Arial, sans-serif; font-size: 15px; }
    .small { fill: #3b3e45; font-family: Arial, sans-serif; font-size: 13px; }
    .connector { stroke: #9aa1ad; stroke-width: 2; fill: none; }
    .node { fill: #ff3d9a; }
    .legend { fill: #c8cdd5; font-family: Arial, sans-serif; font-size: 13px; }
  </style>

  <rect class="bg" width="1800" height="1120" />
  <rect class="top" width="1800" height="62" />
  <text class="title" x="28" y="39">SPOTGO - IMPACT MAP</text>

  <rect class="column" x="20" y="78" width="330" height="930" />
  <rect class="column" x="370" y="78" width="330" height="930" />
  <rect class="column" x="720" y="78" width="330" height="930" />
  <rect class="column" x="1070" y="78" width="330" height="930" />
  <rect class="column" x="1420" y="78" width="360" height="930" />

  <text class="header" x="38" y="108">BUSINESS GOALS</text>
  <text class="header" x="388" y="108">ACTORS / PERSONAS</text>
  <text class="header" x="738" y="108">IMPACTS</text>
  <text class="header" x="1088" y="108">DELIVERABLES</text>
  <text class="header" x="1438" y="108">USER STORIES</text>

  <!-- Business Goal 1 -->
  <rect class="goal" x="38" y="140" width="294" height="190" rx="6" />
  <text class="label" x="56" y="168">BG01</text>
  <text class="text" x="56" y="195"><tspan x="56" dy="0">Validar SpotGo en 3</tspan><tspan x="56" dy="22">estacionamientos piloto</tspan><tspan x="56" dy="22">de alta afluencia durante</tspan><tspan x="56" dy="22">los primeros 6 meses.</tspan></text>

  <rect class="actor" x="388" y="140" width="294" height="78" rx="6" />
  <text class="label" x="406" y="168">Carlos Ramirez</text>
  <text class="text" x="406" y="192">Parking Administrator</text>
  <rect class="actor" x="388" y="250" width="294" height="78" rx="6" />
  <text class="label" x="406" y="278">Andres Salazar</text>
  <text class="text" x="406" y="302">Driver</text>

  <rect class="impact" x="738" y="140" width="294" height="78" rx="6" />
  <text class="text" x="756" y="169"><tspan x="756" dy="0">Configura zonas y perfiles</tspan><tspan x="756" dy="22">para operar el piloto.</tspan></text>
  <rect class="impact" x="738" y="250" width="294" height="78" rx="6" />
  <text class="text" x="756" y="279"><tspan x="756" dy="0">Se registra, reserva, paga y</tspan><tspan x="756" dy="22">sigue la ruta correspondiente.</tspan></text>

  <rect class="deliverable" x="1088" y="140" width="294" height="78" rx="6" />
  <text class="text" x="1106" y="169"><tspan x="1106" dy="0">Configuración móvil de</tspan><tspan x="1106" dy="22">Parking Zones y perfiles.</tspan></text>
  <rect class="deliverable" x="1088" y="250" width="294" height="78" rx="6" />
  <text class="text" x="1106" y="279"><tspan x="1106" dy="0">Experiencia móvil de</tspan><tspan x="1106" dy="22">reserva, pago y navegación.</tspan></text>

  <rect class="story" x="1438" y="130" width="324" height="98" rx="6" />
  <text class="label" x="1456" y="158">US02 / US03</text>
  <text class="small" x="1456" y="182"><tspan x="1456" dy="0">Configurar zonas y registrar</tspan><tspan x="1456" dy="19">y clasificar usuarios/vehículos.</tspan></text>
  <rect class="story" x="1438" y="240" width="324" height="98" rx="6" />
  <text class="label" x="1456" y="268">US13 / US27 / US18 / US19 / US25 / US26</text>
  <text class="small" x="1456" y="292"><tspan x="1456" dy="0">Registro, reserva, pago,</tspan><tspan x="1456" dy="19">Smart Routing y navegación.</tspan></text>

  <!-- Business Goal 2 -->
  <rect class="goal" x="38" y="410" width="294" height="190" rx="6" />
  <text class="label" x="56" y="438">BG02</text>
  <text class="text" x="56" y="465"><tspan x="56" dy="0">Reducir en 20% el tiempo</tspan><tspan x="56" dy="22">promedio de búsqueda en</tspan><tspan x="56" dy="22">los pilotos al finalizar el</tspan><tspan x="56" dy="22">sexto mes, frente a la línea</tspan><tspan x="56" dy="22">base.</tspan></text>

  <rect class="actor" x="388" y="450" width="294" height="100" rx="6" />
  <text class="label" x="406" y="478">Andres Salazar</text>
  <text class="text" x="406" y="504"><tspan x="406" dy="0">Driver</tspan><tspan x="406" dy="22">Consulta antes de recorrer.</tspan></text>

  <rect class="impact" x="738" y="450" width="294" height="100" rx="6" />
  <text class="text" x="756" y="478"><tspan x="756" dy="0">Identifica una zona con</tspan><tspan x="756" dy="22">Availability y reduce</tspan><tspan x="756" dy="22">recorridos innecesarios.</tspan></text>

  <rect class="deliverable" x="1088" y="450" width="294" height="100" rx="6" />
  <text class="text" x="1106" y="478"><tspan x="1106" dy="0">Vista móvil actualizada</tspan><tspan x="1106" dy="22">y sincronización de</tspan><tspan x="1106" dy="22">Availability por zona.</tspan></text>

  <rect class="story" x="1438" y="450" width="324" height="100" rx="6" />
  <text class="label" x="1456" y="478">US01 / US04 / TS01 / TS02</text>
  <text class="small" x="1456" y="502"><tspan x="1456" dy="0">Disponibilidad, zonas</tspan><tspan x="1456" dy="19">permitidas, sincronización</tspan><tspan x="1456" dy="19">y persistencia móvil.</tspan></text>

  <!-- Business Goal 3 -->
  <rect class="goal" x="38" y="680" width="294" height="190" rx="6" />
  <text class="label" x="56" y="708">BG03</text>
  <text class="text" x="56" y="735"><tspan x="56" dy="0">Reducir en 15% las</tspan><tspan x="56" dy="22">incidencias de parking</tspan><tspan x="56" dy="22">indebido en los pilotos</tspan><tspan x="56" dy="22">al finalizar el sexto mes,</tspan><tspan x="56" dy="22">frente a la línea base.</tspan></text>

  <rect class="actor" x="388" y="720" width="294" height="100" rx="6" />
  <text class="label" x="406" y="748">Carlos Ramirez</text>
  <text class="text" x="406" y="774"><tspan x="406" dy="0">Parking Administrator</tspan><tspan x="406" dy="22">Supervisa y responde.</tspan></text>

  <rect class="impact" x="738" y="720" width="294" height="100" rx="6" />
  <text class="text" x="756" y="748"><tspan x="756" dy="0">Monitorea la ocupación,</tspan><tspan x="756" dy="22">atiende alertas y analiza</tspan><tspan x="756" dy="22">patrones de uso.</tspan></text>

  <rect class="deliverable" x="1088" y="720" width="294" height="100" rx="6" />
  <text class="text" x="1106" y="748"><tspan x="1106" dy="0">Dashboard móvil, alertas</tspan><tspan x="1106" dy="22">por Unauthorized Parking</tspan><tspan x="1106" dy="22">y Occupancy Reports.</tspan></text>

  <rect class="story" x="1438" y="720" width="324" height="100" rx="6" />
  <text class="label" x="1456" y="748">US05 / US06 / US07 / US08</text>
  <text class="small" x="1456" y="772"><tspan x="1456" dy="0">Monitorear, alertar,</tspan><tspan x="1456" dy="19">supervisar y reportar.</tspan></text>

  <!-- Connectors -->
  <path class="connector" d="M332 235 H370 M350 235 V289 H370 M700 179 H720 M700 289 H720 M1050 179 H1070 M1050 289 H1070 M1400 179 H1420 M1400 289 H1420" />
  <path class="connector" d="M332 505 H370 M700 500 H720 M1050 500 H1070 M1400 500 H1420" />
  <path class="connector" d="M332 775 H370 M700 770 H720 M1050 770 H1070 M1400 770 H1420" />
  <circle class="node" cx="350" cy="235" r="7" /><circle class="node" cx="710" cy="179" r="7" /><circle class="node" cx="1060" cy="179" r="7" /><circle class="node" cx="1410" cy="179" r="7" />
  <circle class="node" cx="350" cy="505" r="7" /><circle class="node" cx="710" cy="500" r="7" /><circle class="node" cx="1060" cy="500" r="7" /><circle class="node" cx="1410" cy="500" r="7" />
  <circle class="node" cx="350" cy="775" r="7" /><circle class="node" cx="710" cy="770" r="7" /><circle class="node" cx="1060" cy="770" r="7" /><circle class="node" cx="1410" cy="770" r="7" />

  <text class="legend" x="20" y="1048">Los objetivos son metas iniciales de validación y no resultados alcanzados.</text>
</svg>
